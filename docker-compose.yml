services:
  agent-cloud:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${PROJECT_NAME}-server
    ports:
      - 8000:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ubuntu:24.04}
    restart: unless-stopped
