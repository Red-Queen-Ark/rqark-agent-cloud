services:
  agent-cloud:
    build:
      context: .
      dockerfile: docker/Dockerfile.production
      secrets:
        - uv_index_username
        - uv_index_password
    environment:
      - DATA_CLOUD_URL=http://server:7302
      - REDIS_SERVER=redis
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - TASKS_ENABLED=${TASKS_ENABLED:-true}
      - TASK_TICK_SECONDS=${TASK_TICK_SECONDS:-30}
      - TASK_CONCURRENCY=${TASK_CONCURRENCY:-1}
      - TASK_LEADER_TTL=${TASK_LEADER_TTL:-60}
      - TASK_RUN_TIMEOUT=${TASK_RUN_TIMEOUT:-600}
      - TASK_STREAM_MAX_CHARS=${TASK_STREAM_MAX_CHARS:-200000}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ubuntu:24.04}
      - WORKSPACE_MAX_BYTES=${WORKSPACE_MAX_BYTES:-104857600}
      - WORKSPACE_START_TIMEOUT=${WORKSPACE_START_TIMEOUT:-30}
      - WORKSPACE_SHELL_MAX_BYTES=${WORKSPACE_SHELL_MAX_BYTES:-8388608}
      - ASR_ENGINE=${ASR_ENGINE:-}
      - ASR_MODEL=${ASR_MODEL:-}
      - ASR_MODEL_DIR=/models/whisper
      - ASR_LANGUAGE=${ASR_LANGUAGE:-Cantonese}
      - ASR_MAX_BYTES=${ASR_MAX_BYTES:-26214400}
      - ASR_MAX_SECONDS=${ASR_MAX_SECONDS:-60}
      - ASR_TIMEOUT=${ASR_TIMEOUT:-60}
      - ASR_CONCURRENCY=${ASR_CONCURRENCY:-1}
      - ASR_QUEUE_DEPTH=${ASR_QUEUE_DEPTH:-2}
      - ASR_OPENCC=${ASR_OPENCC:-true}
      - ASR_OPENCC_CONFIG=${ASR_OPENCC_CONFIG:-s2hk}
      - VOICE_MAX_CONNECTIONS=${VOICE_MAX_CONNECTIONS:-8}
      - VOICE_MAX_PER_USER=${VOICE_MAX_PER_USER:-1}
      - VOICE_REDIS=${VOICE_REDIS:-true}
      - VOICE_LEASE_TTL=${VOICE_LEASE_TTL:-360}
      - VOICE_MAX_BYTES=${VOICE_MAX_BYTES:-26214400}
      - VOICE_MAX_FRAME_BYTES=${VOICE_MAX_FRAME_BYTES:-65536}
      - VOICE_PREROLL_MS=${VOICE_PREROLL_MS:-3000}
      - VOICE_WAKE_MODEL=${VOICE_WAKE_MODEL:-wednesday,diana}
      - VOICE_WAKE_WINDOW=${VOICE_WAKE_WINDOW:-10}
      - VOICE_VAD_SILENCE_MS=${VOICE_VAD_SILENCE_MS:-800}
      - HF_HOME=/models/hf
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - asr-models:/models
    mem_limit: ${ASR_MEM_LIMIT:-3g}
    container_name: ${PROJECT_NAME}-server
    networks:
      - rqark-project
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  asr-models:
    name: ${PROJECT_NAME}-asr-models

networks:
  rqark-project:
    name: rqark-project
    external: true

secrets:
  uv_index_username:
    environment: REGISTRY_USERNAME
  uv_index_password:
    environment: REGISTRY_PASSWORD
